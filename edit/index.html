<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151515" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Edit Family Calendar</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/edit/editor.css" />
  </head>
  <body>
    <header class="editor-header">
      <div>
        <p class="eyebrow">Private editor</p>
        <h1>Family Calendar</h1>
      </div>
      <a class="view-link" href="/" target="_blank" rel="noreferrer">View</a>
    </header>

    <main>
      <section class="unlock" id="unlock-panel" aria-labelledby="unlock-title">
        <h2 id="unlock-title">Enter the family PIN</h2>
        <form id="unlock-form">
          <label for="pin">6-digit PIN</label>
          <div class="pin-row">
            <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
            <button class="primary" type="submit">Open</button>
          </div>
          <p class="form-message" id="unlock-message" role="status"></p>
        </form>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="toolbar" aria-label="Calendar controls">
          <button id="add-event" class="primary" type="button">Add event</button>
          <button id="undo" type="button" disabled>Undo</button>
          <button id="save" class="save" type="button" disabled>Save</button>
        </div>
        <p class="sync-status" id="sync-status" role="status">Loading calendar...</p>
        <div id="event-list"></div>
      </section>
    </main>

    <dialog id="event-dialog">
      <form id="event-form" method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Calendar item</p>
            <h2 id="dialog-title">Add event</h2>
          </div>
          <button class="close" id="close-dialog" type="button" aria-label="Close">×</button>
        </div>

        <input id="event-id" type="hidden" />
        <label for="event-label">Title</label>
        <input id="event-label" type="text" maxlength="120" autocomplete="off" required />

        <label for="event-category">Who</label>
        <select id="event-category" required>
          <option value="dad">Dad</option>
          <option value="mom">Mom</option>
          <option value="school">School</option>
          <option value="helper">Helper</option>
        </select>

        <div class="date-grid">
          <div>
            <label for="event-start">Starts</label>
            <input id="event-start" type="date" min="2026-10-01" max="2026-12-31" required />
          </div>
          <div>
            <label for="event-end">Ends</label>
            <input id="event-end" type="date" min="2026-10-01" max="2026-12-31" required />
          </div>
        </div>

        <p class="form-message" id="event-message" role="status"></p>
        <div class="dialog-actions">
          <button class="danger" id="delete-event" type="button">Delete</button>
          <button class="primary" type="submit">Done</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/edit/editor.js"></script>
  </body>
</html>
